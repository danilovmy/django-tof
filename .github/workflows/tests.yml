name: Test TOF
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        django-version: ['4.2', '5.0']
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: tof_test
          POSTGRES_PASSWORD: tof_test
          POSTGRES_DB: tof_library
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      TOF_DB_PASSWORD: tof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl "Django~=${{ matrix.django-version }}.0" "django-ckeditor>=6.7,<7"
          python -m pip check
      - name: Check the installed package
        run: python -m django check
      - name: Run PostgreSQL regressions
        run: python -m django test tests --keepdb --noinput
